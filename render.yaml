databases:
  - name: gestao-comercial-db
    databaseName: gestao_comercial
    user: gestao_user
    plan: free

services:
  - type: web
    name: gestao-comercial-api
    runtime: docker
    plan: free
    healthCheckPath: /
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DATABASE_URL
        fromDatabase:
          name: gestao-comercial-db
          property: connectionString
      - key: CORS_ALLOWED_ORIGINS
        value: "*"
